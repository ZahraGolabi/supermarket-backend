version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: snapshop-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: snapshop
      MYSQL_USER: snapshop
      MYSQL_PASSWORD: 1234
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - snapshop-network

  redis:
    image: redis:latest
    container_name: snapshop-redis
    restart: always
    ports:
      - '6379:6379'
    networks:
      - snapshop-network

  api:
    build: .
    container_name: snapshop-api
    env_file: .env
    environment:
      DB_ENGINE: mysql
      MYSQL_HOST: mysql
      REDIS_URL: redis://redis:6379/0
    ports:
      - '8000:8000'
    depends_on:
      - mysql
      - redis
    networks:
      - snapshop-network
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_owner &&
             python manage.py runserver 0.0.0.0:8000"

networks:
  snapshop-network:
    driver: bridge

volumes:
  mysql_data:
