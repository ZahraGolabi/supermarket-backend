<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تایید رمز یکبار مصرف | اسنپ مارکت</title>
    <link rel="stylesheet" href="assets/css/login.css" />
  </head>
  <body>
    <svg class="icon">
      <symbol
        id="arrow-right"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M5 12H19M19 12L13 6M19 12L13 18"
          stroke="#000000"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </symbol>
    </svg>

    <div class="wrapper-login wrapper-login-password">
      <div class="login login-password">
        <div class="login-logo wrap-icon">
          <a href="login.html" class="login-logo__link">
          <svg class="wrap-icon__img">
            <use href="#arrow-right" />
          </svg>
          </a>
        </div>
        <h2 class="login-title login-password__title">رمز یکبار مصرف را وارد کنید:</h2>
        <p class="login-password__description">
          رمز یکبار مصرف به شماره
          <span class="login-password__phone-number">09015960307</span>
          ارسال شد
        </p>
        <form action="" class="form">
          <div class="otp-inputs">
            <input type="text" class="otp-input" maxlength="1" />
            <input type="text" class="otp-input" maxlength="1" />
            <input type="text" class="otp-input" maxlength="1" />
            <input type="text" class="otp-input" maxlength="1" />
            <input type="text" class="otp-input" maxlength="1" />
           </div>
          <span class="resend-link"
            >رمز دریافت نکردید؟<a href="" class="resend-link__link">ارسال مجدد رمز </a></span
          >
          <button class="submit-btn submit-btn__otp" type="submit">تایید</button>
        </form>
      </div>
    </div>
    <script src="assets/js/funcs/otp.js"></script>
  </body>
</html>
